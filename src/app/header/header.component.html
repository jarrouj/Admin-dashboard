<header class="bg-white">
  <nav class="mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8" aria-label="Global">
    <div class="flex lg:flex-1">
      <a href="#" class="-m-1.5 p-1.5">
        <span class="sr-only">Admin Portal</span>
      </a>
    </div>
    <div class="flex lg:hidden">
      <button type="button" class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-700">
        <span class="sr-only">Open main menu</span>
        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>
    <div class="hidden lg:flex lg:gap-x-12">
      <a routerLink="home" class="text-sm/6 font-semibold text-gray-900">Home</a>
      <a routerLink="products" class="text-sm/6 font-semibold text-gray-900">Products</a>
      <a routerLink="orders" class="text-sm/6 font-semibold text-gray-900">Orders</a>
    </div>
    <div class="hidden lg:flex lg:flex-1 lg:justify-end">
      <!-- Show login button if user is not authenticated, else show profile icon with dropdown -->
      <ng-container *ngIf="!isAuthenticated()">
        <a routerLink="/login" class="text-sm/6 font-semibold text-gray-900">Log in <span aria-hidden="true">&rarr;</span></a>
      </ng-container>

      <!-- Logged-in menu dropdown -->
      <div *ngIf="isAuthenticated()">
        <div class="relative">
          <button type="button" class="flex items-center text-gray-900" (click)="toggleDropdown()">
            <svg class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25c-1.328 0-2.5 1.172-2.5 2.5s1.172 2.5 2.5 2.5 2.5-1.172 2.5-2.5-1.172-2.5-2.5-2.5zm0 10.5c-2.485 0-4.5 1.22-4.5 2.75v1.5h9v-1.5c0-1.53-2.015-2.75-4.5-2.75z" />
            </svg>
            <svg class="ml-2 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- Dropdown menu items -->
          <div *ngIf="isDropdownOpen" class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-md py-1">
            <a href="#" class="block px-4 py-2 text-sm text-gray-700">Profile</a>
            <a (click)="logout()" href="#" class="block px-4 py-2 text-sm text-gray-700">Log out</a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
