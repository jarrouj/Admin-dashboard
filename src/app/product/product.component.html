<div class="relative mb-4 text-center mt-10">
  <button type="button" (click)="toggleDropdown()" class="inline-flex justify-center items-center bg-blue-500 text-black px-6 py-3 rounded-md shadow-md hover:bg-blue-600">
    Add Product
    <svg class="ml-2 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
</div>

<div *ngIf="isDropdownOpen" class="absolute left-1/2 transform -translate-x-1/2 mt-[-10px] w-80 p-4 bg-white shadow-lg rounded-md z-10">
  <div class="mb-2">
    <label for="productName" class="block text-sm font-semibold text-black">Product Name</label>
    <input [(ngModel)]="productName" id="productName" type="text" class="w-full p-2 border border-gray-300 rounded-md text-black" placeholder="Enter product name" style="color: black;" />
  </div>

  <div class="mb-2">
    <label for="description" class="block text-sm font-semibold text-black">Description</label>
    <textarea [(ngModel)]="description" id="description" class="w-full p-2 border border-gray-300 rounded-md text-black" placeholder="Enter product description" style="color: black;"></textarea>
  </div>

  <div class="mb-2">
    <label for="image" class="block text-sm font-semibold text-black">Image URL</label>
    <input [(ngModel)]="image" id="image" type="text" class="w-full p-2 border border-gray-300 rounded-md text-black" placeholder="Enter image URL" style="color: black;" />
  </div>

  <div class="mb-2">
    <label for="quantity" class="block text-sm font-semibold text-black">Quantity</label>
    <input [(ngModel)]="quantity" id="quantity" type="number" class="w-full p-2 border border-gray-300 rounded-md text-black" placeholder="Enter quantity" style="color: black;" />
  </div>

  <div class="mb-2">
    <label for="price" class="block text-sm font-semibold text-black">Price</label>
    <input [(ngModel)]="price" id="price" type="number" class="w-full p-2 border border-gray-300 rounded-md text-black" placeholder="Enter price" style="color: black;" />
  </div>

  <button (click)="submitProduct()" class="w-full bg-green-500 text-black py-2 rounded-md hover:bg-green-600">Add Product</button>
</div>

<table class="min-w-full bg-white border border-gray-300 mt-4">
  <thead>
    <tr>
      <th class="py-2 px-4 text-left text-black">ID</th>
      <th class="py-2 px-4 text-left text-black">Name</th>
      <th class="py-2 px-4 text-left text-black">Price</th>
      <th class="py-2 px-4 text-left text-black">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let product of products">
      <td class="py-2 px-4 text-black">{{ product.id }}</td>
      <td class="py-2 px-4 text-black">{{ product.name }}</td>
      <td class="py-2 px-4 text-black">{{ product.price }}</td>
      <td class="py-2 px-4">
        <button (click)="editProduct(product)" class="bg-yellow-500 text-white py-1 px-2 rounded-md hover:bg-yellow-600">Edit</button>
        <button (click)="deleteProduct(product.id)" class="bg-red-500 text-white py-1 px-2 rounded-md hover:bg-red-600 ml-2">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
